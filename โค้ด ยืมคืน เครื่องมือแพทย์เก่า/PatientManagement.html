<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; margin: 0; }
    .hidden-app { display: none !important; }
    #loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #9333ea; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .input-field { border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; width: 100%; outline: none; transition: all 0.2s; background: white; }
  </style>
</head>
<body>

  <div id="login-section" class="min-h-screen flex items-center justify-center p-4 text-center">
    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl border-t-[12px] border-purple-600 max-w-sm w-full">
      <div class="text-6xl mb-6">🔐</div>
      <h2 class="text-2xl font-black text-slate-800 mb-1 tracking-tighter">จัดการทะเบียนคนไข้</h2>
      <p class="text-xs text-slate-400 mb-8 uppercase tracking-widest font-bold">Admin Only Access</p>
      <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 text-red-500 text-xs font-bold rounded-xl animate-pulse">❌ รหัสผ่านไม่ถูกต้อง!</div>
      <input type="password" id="pass-field" placeholder="••••••" class="w-full text-center text-4xl tracking-[0.4em] p-4 border-2 border-purple-50 rounded-2xl mb-6 outline-none focus:border-purple-600 bg-slate-50 shadow-inner">
      <button onclick="attemptLogin()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all text-lg font-bold font-sans">เข้าใช้งาน</button>
      <div class="mt-8 pt-6 border-t border-slate-100"><a href="<?= scriptUrl ?>?p=borrow" target="_top" class="text-xs font-bold text-slate-400 hover:text-blue-600 transition-colors underline decoration-dotted">← กลับหน้ายืมเครื่องมือแพทย์</a></div>
    </div>
  </div>

  <div id="loader"><div class="spinner mb-3"></div><p id="l-text" class="text-purple-600 font-bold text-center font-sans">กำลังดำเนินการ...</p></div>

  <div id="main-app" class="hidden-app p-2 md:p-8">
    <div class="max-w-4xl mx-auto mb-6 flex flex-wrap justify-center gap-3">
      <a href="<?= scriptUrl ?>?p=borrow" target="_top" class="bg-white text-blue-600 border border-blue-50 px-5 py-2.5 rounded-2xl shadow-sm font-bold text-sm transition-all hover:bg-blue-50 font-sans">หน้ายืมเครื่อง</a>
      <a href="<?= scriptUrl ?>?p=return" target="_top" class="bg-white text-red-600 border border-red-50 px-5 py-2.5 rounded-2xl shadow-sm font-bold text-sm transition-all hover:bg-red-50 text-center font-sans">หน้าคืน/แก้ไข <br><span class="text-[9px]">(ต้องมีรหัสผ่านเข้าเมนูนี้)</span></a>
      <button class="bg-purple-600 text-white px-5 py-2.5 rounded-2xl shadow-md font-bold text-sm text-center font-sans">จัดการคนไข้ <br><span class="text-[9px]">(ต้องมีรหัสผ่านเข้าเมนูนี้)</span></button>
      <a href="<?= scriptUrl ?>?p=dashboard" target="_top" class="bg-white text-slate-700 border border-slate-200 px-5 py-2.5 rounded-2xl shadow-sm font-bold text-sm transition-all hover:bg-slate-50 font-sans">แดชบอร์ด/พิมพ์ใบงาน</a>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border-t-8 border-purple-600 p-6">
      <h2 class="text-2xl font-bold mb-6 text-purple-700 text-center uppercase tracking-tighter font-sans">👥 ทะเบียนคนไข้ (เรียงตาม HN)</h2>
      <select id="p-select" onchange="loadForm(this.value)" class="w-full p-4 border border-slate-200 rounded-2xl font-bold mb-8 shadow-sm text-slate-700 outline-none focus:ring-2 focus:ring-purple-200 bg-white font-mono"></select>
      
      <div id="edit-form" class="hidden space-y-4 animate-in fade-in duration-300 font-sans">
        <input type="hidden" id="old-hn">
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-[10px] font-bold text-slate-400 uppercase">HN *</label><input type="text" id="edit-hn" class="input-field font-bold shadow-inner bg-slate-50"></div>
          <div><label class="text-[10px] font-bold text-slate-400 uppercase">ชื่อ-นามสกุล *</label><input type="text" id="edit-name" class="input-field font-bold"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-[10px] font-bold text-slate-400">ชื่อญาติ</label><input type="text" id="edit-rel" class="input-field"></div>
          <div><label class="text-[10px] font-bold text-slate-400">ความสัมพันธ์</label><input type="text" id="edit-ship" class="input-field"></div>
        </div>
        <div><label class="text-[10px] font-bold text-slate-400">ที่อยู่</label><textarea id="edit-addr" rows="2" class="input-field"></textarea></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-[10px] font-bold text-slate-400">เบอร์โทร</label><input type="tel" id="edit-phone" class="input-field"></div>
          <div><label class="text-[10px] font-bold text-slate-400">สถานะ</label>
            <select id="edit-status" class="input-field font-bold text-purple-600 bg-white">
              <option value="Admit">Admit</option><option value="D/C">D/C</option><option value="เสียชีวิต">เสียชีวิต</option>
            </select>
          </div>
        </div>
        <button onclick="submitUpdate()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all mt-4 font-bold text-lg">บันทึกการแก้ไขข้อมูล</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = '<?= scriptUrl ?>'; const AUTH_KEY = 'hhc_final_auth_session_v3';
    function attemptLogin() { const val = document.getElementById('pass-field').value; const errorDiv = document.getElementById('error-msg'); if (val === '999999') { const expiry = new Date().getTime() + (20 * 60 * 1000); localStorage.setItem(AUTH_KEY, expiry.toString()); showApp(); } else { errorDiv.classList.remove('hidden'); setTimeout(()=> errorDiv.classList.add('hidden'), 3000); } }
    function showApp() { document.getElementById('login-section').style.display = 'none'; document.getElementById('main-app').classList.remove('hidden-app'); init(); }
    window.onload = () => { const session = localStorage.getItem(AUTH_KEY); const now = new Date().getTime(); if (session && now < parseInt(session)) { showApp(); } else { document.getElementById('login-section').style.display = 'flex'; } };
    function showLoader(s, t="กำลังประมวลผล...") { document.getElementById('loader').style.display = s ? 'flex' : 'none'; document.getElementById('l-text').innerText = t; if(s) setTimeout(()=>showLoader(false), 15000); }
    function init() { showLoader(true, "โหลดรายชื่อคนไข้..."); google.script.run.withSuccessHandler(data => { showLoader(false); pList = data; const sel = document.getElementById('p-select'); sel.innerHTML = '<option value="" disabled selected>-- เลือกคนไข้เพื่อจัดการ --</option>'; data.forEach(p => sel.innerHTML += `<option value="${p.hn}">${p.hn} - ${p.name} (${p.status})</option>`); }).withFailureHandler(err => { showLoader(false); Swal.fire('Error', err.message, 'error'); }).getAllPatientsForManage(); }
    function loadForm(hn) { const p = pList.find(x => x.hn == hn); if(!p) return; document.getElementById('edit-form').classList.remove('hidden'); document.getElementById('old-hn').value = p.hn; document.getElementById('edit-hn').value = p.hn; document.getElementById('edit-name').value = p.name; document.getElementById('edit-rel').value = p.relative; document.getElementById('edit-ship').value = p.relationship; document.getElementById('edit-addr').value = p.address; document.getElementById('edit-phone').value = p.phone; document.getElementById('edit-status').value = p.status; }
    function submitUpdate() { 
      const data = { hn: document.getElementById('edit-hn').value, name: document.getElementById('edit-name').value, relative: document.getElementById('edit-rel').value, relationship: document.getElementById('edit-ship').value, address: document.getElementById('edit-addr').value, phone: document.getElementById('edit-phone').value, status: document.getElementById('edit-status').value }; 
      showLoader(true, "กำลังบันทึก..."); 
      google.script.run.withSuccessHandler(res => { 
        showLoader(false); 
        Swal.fire('สำเร็จ', res, 'success').then(() => { 
          // 🚀 ใช้ window.top แก้จอขาว
          window.top.location.href = SCRIPT_URL + "?p=patient_manage"; 
        }); 
      }).withFailureHandler(err => { showLoader(false); Swal.fire('Error', err.message, 'error'); }).updatePatientFullDetails(document.getElementById('old-hn').value, data); 
    }
  </script>
</body>
</html>
